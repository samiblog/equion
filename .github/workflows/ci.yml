# Equion CI — DECISIONS D19
#   locked    uv.lock 그대로(재현 환경) · Linux·Windows·macOS · Python 3.12~3.14
#   minimal   선택 의존성(pyarrow·plotly) 없이 — 코어만으로 모든 검사가 도는지
#   lowest    pyproject의 하한(numpy 2.1·pandas 2.2.2·scipy 1.14·openpyxl 3.1, Python 3.12)
#   latest    나온 최신판(Python 3.14) — 주간 일정에서는 사전 공개판(--prerelease allow)까지
#   desk      앱 Equion Desk(desk/ — 별도 패키지) 시험 · Windows·Linux
#   desk-ui   화면 점검 — 진짜 브라우저(Edge)로 화면을 몰아 D1 의 완료 기준까지 · Windows
#   desk-installer  설치 파일 만들기 → 조용히 설치 → 설치 폴더의 런타임만으로 기동 시험 → 제거 · Windows (설치 파일은 작업 결과물로)
#   audit     잠근 의존성의 알려진 취약점(pip-audit) — 앱 의존성 포함
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"   # 매주 월요일 — 새 판 의존성으로 미리 깨지는지
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON_DOWNLOADS: automatic
  PYTHONWARNDEFAULTENCODING: "1"   # 인코딩을 안 준 open() 등을 경고로(Windows 기본 인코딩 문제를 미리)

jobs:
  locked:
    name: locked · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.13"]
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: windows-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: 환경(uv.lock 그대로)
        run: uv sync --locked
      - name: 검사 묶음(pytest)
        run: uv run --locked pytest
      - name: 명령줄 예시(equion new → check → run)
        shell: bash
        run: |
          set -e
          uv run --locked equion new demo
          cd demo
          uv run --locked equion check EQUATIONS/model.txt --data DATA/data.csv
          uv run --locked equion run scripts/main.py --run-id ci -q
      - name: 예제 프로젝트 스크립트(equion new --template desk → check → run → run --replay)
        shell: bash
        run: |
          set -e
          uv run --locked equion new desk_demo --template desk
          cd desk_demo
          uv run --locked equion check FLOWS/monthly.eqs
          uv run --locked equion run FLOWS/monthly.eqs --set scenarios=base -q
          uv run --locked equion run --replay run:monthly_0001 -q
      - name: API 참조가 코드와 같은지(docs/reference/api.md)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: uv run --locked python docs/make_api.py --check

  minimal:
    name: minimal · 선택 의존성 없이 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: 코어만(pyarrow·plotly 없음)
        run: uv sync --locked --no-dev
      - name: pyarrow·plotly가 정말 없는지
        run: uv run --locked --no-dev python -c "import importlib.util as u, sys; sys.exit(any(u.find_spec(m) for m in ('pyarrow', 'plotly')))"
      - name: 검사 묶음
        shell: bash
        env:
          PYTHONIOENCODING: utf-8   # 검사 스크립트의 화면 출력만(로그 파일). 패키지의 cp1252 처리는 test_cli가 따로 본다
        run: |
          set -e
          for t in engine workfile cli stats scenarios docs ast_formula 100_equations; do
            uv run --locked --no-dev python tests/test_$t.py > "log_$t.txt" 2>&1 || { tail -40 "log_$t.txt"; exit 1; }
            tail -3 "log_$t.txt"
          done

  desk:
    name: desk · 앱 시험 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]   # 창은 Windows 전용, 서버·경계 시험은 어느 OS에서나(D29)
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: 앱 시험(equion-desk)
        run: uv run --locked --package equion-desk pytest desk

  desk-ui:
    name: desk · 화면 점검(Edge)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: 화면 점검(playwright — 실행기에 있는 Edge 를 몬다)
        env:
          PYTHONIOENCODING: utf-8
        run: uv run --locked --package equion-desk --group ui python desk/tests/ui_check.py --shots ui-shots
      - name: 화면 그림 남기기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desk-ui-shots
          path: ui-shots/
          retention-days: 14

  desk-installer:
    name: desk · 설치본 빌드·기동 시험
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Inno Setup(한국어 설치 화면이 든 최신판)
        run: choco upgrade innosetup -y --no-progress
      - name: 설치 파일 만들기(런타임 묶기 → Inno Setup)
        env:
          PYTHONIOENCODING: utf-8
        run: uv run --locked python desk/build/make.py
      - name: 조용히 설치(관리자 권한 없이 — 사용자별)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem desk/dist/EquionDesk-*-setup.exe)[0]
          "{0} ({1:N0} MB)" -f $setup.Name, ($setup.Length / 1MB)
          $dir = Join-Path $env:RUNNER_TEMP "EquionDesk"
          Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`"" -Wait
          if (-not (Test-Path (Join-Path $dir "runtime/python.exe"))) { throw "설치되지 않았습니다: $dir" }
          "EQUION_DESK_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: 기동 시험(설치 폴더의 런타임만으로 — 서버·작업 프로세스·추정·과거 재현·전망)
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: uv run --locked python desk/build/smoke.py "$env:EQUION_DESK_DIR"
      - name: 창 띄우기(창은 하나) — 실행기에 WebView2·화면이 없으면 실패할 수 있어 알리기만 한다
        continue-on-error: true
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: uv run --locked python desk/build/smoke.py "$env:EQUION_DESK_DIR" --window
      - name: 제거(설치 폴더의 런타임이 사라지는지)
        shell: pwsh
        run: |
          Start-Process -FilePath (Join-Path $env:EQUION_DESK_DIR "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          Start-Sleep -Seconds 3
          if (Test-Path (Join-Path $env:EQUION_DESK_DIR "runtime")) { throw "제거한 뒤에도 런타임이 남았습니다" }
      - name: 설치 파일 남기기(다른 PC 점검용 — 저장소에는 넣지 않는다)
        uses: actions/upload-artifact@v4
        with:
          name: EquionDesk-setup
          path: desk/dist/EquionDesk-*-setup.exe
          retention-days: 14
          compression-level: 0

  lowest:
    name: lowest · 하한 버전 · py3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: 하한 버전으로 설치(lowest-direct)
        run: |
          uv venv -p 3.12 .venv-lowest
          VIRTUAL_ENV=.venv-lowest uv pip install --resolution lowest-direct -e . "pytest>=8"
          .venv-lowest/bin/python -c "import numpy, pandas, scipy, openpyxl; print(numpy.__version__, pandas.__version__, scipy.__version__, openpyxl.__version__)"
      - name: 검사 묶음
        run: .venv-lowest/bin/python -m pytest

  latest:
    name: latest · 최신판${{ github.event_name == 'schedule' && ' + 사전 공개판' || '' }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: 최신판으로 설치
        shell: bash
        run: |
          PRE=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then PRE="--prerelease allow"; fi
          uv venv -p 3.14 .venv-latest
          VIRTUAL_ENV=.venv-latest uv pip install $PRE --upgrade -e ".[all]" "pytest>=8"
          uv pip list --python .venv-latest | grep -Ei "^(numpy|pandas|scipy|openpyxl|pyarrow|plotly) "
      - name: 검사 묶음(경고도 보이게)
        shell: bash
        run: |
          PY=.venv-latest/bin/python
          [ -x "$PY" ] || PY=.venv-latest/Scripts/python.exe
          "$PY" -m pytest -W "default::DeprecationWarning" -W "default::FutureWarning"

  audit:
    name: audit · 알려진 취약점
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: pip-audit(잠근 버전·해시 그대로)
        run: |
          uv export --locked --format requirements-txt --all-packages --all-extras --all-groups --no-emit-workspace > requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --require-hashes --disable-pip --progress-spinner off

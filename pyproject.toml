[project]
name = "equion"
version = "0.8.0"
description = "방정식·연립방정식 추정·풀이·시뮬레이션 — 방정식 DSL·블록 Newton 솔버·워크파일 API·명령줄"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
requires-python = ">=3.12"

# 범위 의존성(DECISIONS D19): 설치하는 쪽(pip·pipx·다른 패키지)과 충돌하지 않도록 범위로 적고,
# 이 저장소의 실행 환경은 uv.lock이 정확한 버전·해시로 고정한다(재현성 — 문서 출력은 lock 기준).
# 아래 하한·상한은 CI의 lowest·latest 작업이 실제로 검사한다(.github/workflows/ci.yml).
# CPU(OpenBLAS 커널)·BLAS(MKL)가 다르면 말자리 수치가 달라질 수 있다 — 결과 비교는 허용오차로.
# 회귀·검정은 자체 구현(equion/stats) — 외부 회귀 패키지에 의존하지 않는다(D17).
dependencies = [
    "numpy>=2.1,<3",
    "pandas>=2.2.2,<4",
    "scipy>=1.14,<2",
    "openpyxl>=3.1,<4", # 엑셀(.xlsx) 읽기·쓰기 엔진
    "tomlkit>=0.12,<1", # 정의 파일(TOML)을 주석·순서를 지키며 고친다(D38)
]

[project.optional-dependencies]
# 선택 기능 — 없어도 코어(추정·풀이·워크파일·명령줄·보고서 그래프)는 모두 동작한다.
parquet = ["pyarrow>=17"]  # 0.6.0까지의 워크파일·번들(parquet) 읽기, DataFrame.to_parquet
plot = ["plotly>=5.24"]    # GraphOutput.figure()(plotly Figure 객체)·compare_and_plot. 그리기 자체는 내장 plotly.js
all = ["equion[parquet,plot]"]

[project.scripts]
equion = "equion.cli:main"   # = python -m equion

[dependency-groups]
# 개발·검증용(코어에는 불필요). 코어만: `uv sync --no-dev`.
dev = [
    "ipykernel>=6",   # 노트북 실행
    "pytest>=8",      # tests/ 묶음 실행(각 파일은 python tests/test_x.py로도 돈다)
    "pyarrow>=17",    # 선택 기능 검사(레거시 parquet 읽기)
    "plotly>=5.24",   # 선택 기능 검사(figure())
]

[tool.uv]
# uv 판 하한 — 옛 uv(0.5.x)는 pyproject를 고치면 uv.lock의 무관한 마커까지 다시 썼고, 저장소 최상위에서
# `uv run equion`이 같은 이름의 equion/ 폴더를 스크립트로 실행했다. CI(astral-sh/setup-uv)도 이 값을 읽어
# 맞는 판을 설치한다(version 입력이 없을 때). 하한이라 더 새 uv는 그대로 쓴다 — 새 판 기능에 기댈 때만 올린다.
required-version = ">=0.13.7"

# 데스크톱 앱 Equion Desk는 desk/의 별도 패키지 equion-desk(DECISIONS D28) — 잠금 파일은 하나를 함께 쓰고 설치는 따로.
# 최상위의 `uv sync`·`uv run`은 지금처럼 equion만 설치한다. 앱까지: `uv sync --all-packages`.
[tool.uv.workspace]
members = ["desk"]

# 설치형 패키지(DECISIONS D6): `uv sync`가 이 저장소를 .venv에 편집 가능 설치하고 `equion` 명령을 만든다.
# 다른 PC에는 `pipx install <저장소 경로 또는 git URL>` · `uv tool install …`.
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["equion"]

[tool.hatch.build.targets.sdist]
include = ["equion", "README.md", "LICENSE", "THIRD-PARTY-NOTICES.md", "VERSION"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_suite"]   # 각 파일의 test_suite()가 그 파일의 검사 묶음 전체를 돈다
addopts = "-ra"

<!doctype html>
<html lang="ko" data-mode="{{MODE}}" data-version="{{VERSION}}" data-term="{{TERM}}" data-theme-setting="{{THEME}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equion Desk</title>
<link rel="icon" href="/web/img/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/web/css/tokens.css">
<link rel="stylesheet" href="/web/vendor/xterm/xterm.css">
<link rel="stylesheet" href="/web/css/app.css">
<link rel="stylesheet" href="/web/css/views.css">
<link rel="stylesheet" href="/web/css/bench.css">
<link rel="stylesheet" href="/web/css/data.css">
<link rel="stylesheet" href="/web/css/model.css">
<link rel="stylesheet" href="/web/css/forecast.css">
<link rel="stylesheet" href="/web/css/review.css">
<script src="/web/js/boot.js"></script>
</head>
<body>
<div id="app">
  <header id="titlebar">
    <div class="brand"><span class="mark"></span><b>Equion Desk</b></div>
    <nav id="ptabs" role="tablist" aria-label="프로젝트"></nav>
    <button id="btn-new" class="icon-btn" type="button" title="프로젝트 열기" aria-label="프로젝트 열기"></button>
    <span class="grow"></span>
    <div class="tools">
      <button id="btn-changes" class="icon-btn" type="button" title="바뀜 기록 — 정의 파일이 언제 누구에 의해 바뀌었나" aria-label="바뀜 기록"></button>
      <button id="btn-side" class="icon-btn" type="button" title="사이드바 보이기·숨기기" aria-label="사이드바" aria-pressed="true"></button>
      <button id="btn-term" class="icon-btn" type="button" title="터미널 보이기·숨기기 (Ctrl+`)" aria-label="터미널" aria-pressed="true"></button>
      <button id="btn-help" class="icon-btn" type="button" title="도움말 (F1)" aria-label="도움말"></button>
      <button id="btn-settings" class="icon-btn" type="button" title="설정" aria-label="설정"></button>
    </div>
  </header>
  <main id="stage">
    <div id="welcome" hidden></div>
  </main>
  <footer id="activity" hidden>
    <span class="lead">작업 기록</span>
    <div id="job"></div>
    <div id="strip" aria-label="작업 기록 띠"></div>
    <button id="btn-records" class="btn small quiet" type="button">모두 보기</button>
  </footer>
  <footer id="status"></footer>
</div>
<script src="/web/vendor/xterm/xterm.js"></script>
<script src="/web/vendor/xterm/addon-fit.js"></script>
<script src="/web/vendor/xterm/addon-unicode11.js"></script>
<script src="/web/vendor/markdown-it/markdown-it.min.js"></script>
<script src="/web/vendor/dompurify/purify.min.js"></script>
<script type="module" src="/web/js/main.js"></script>
</body>
</html>
